<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Abhay Singh — operating systems, compilers, bare-metal Rust">
  <title>Abhay Singh — operating systems · compilers · bare-metal Rust</title>

  <defs>
    <!-- userSpaceOnUse: a vertical bar or horizontal line has a zero-area
         bounding box, which makes an objectBoundingBox gradient fail to paint -->
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="236" y1="0" x2="764" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="wire" gradientUnits="userSpaceOnUse" x1="185" y1="0" x2="815" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="22%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="78%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="frame"><rect x="0" y="0" width="1000" height="200" rx="14"/></clipPath>

    <style>
      .mono { font-family: "DejaVu Sans Mono","Liberation Mono",Consolas,Menlo,monospace; }
      @keyframes blink { 0%,45% { opacity: 1; } 55%,100% { opacity: 0; } }
      @keyframes dash  { to { stroke-dashoffset: -48; } }
      /* cores coming online, then regions being mapped */
      @keyframes pulse { 0%,100% { opacity: 0.14; } 45% { opacity: 1; } }
      .cursor { animation: blink 1.15s step-end infinite; }
      .flow   { stroke-dasharray: 6 10; animation: dash 2.4s linear infinite; }
      .blk    { animation: pulse 3.2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .cursor, .flow, .blk { animation: none; }
        .blk { opacity: 0.62; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1000" height="200" fill="#0d1117"/>

    <!-- data path -->
    <line class="flow" x1="185" y1="100" x2="815" y2="100" stroke="url(#wire)" stroke-width="1.4"/>

    <!-- left: SMP cores bootstrapping, one AP at a time -->
    <g transform="translate(76 80)" fill="#22d3ee">
      <rect class="blk" x="0"  y="0"  width="15" height="15" rx="3" style="animation-delay:0s"/>
      <rect class="blk" x="24" y="0"  width="15" height="15" rx="3" style="animation-delay:.18s"/>
      <rect class="blk" x="48" y="0"  width="15" height="15" rx="3" style="animation-delay:.36s"/>
      <rect class="blk" x="72" y="0"  width="15" height="15" rx="3" style="animation-delay:.54s"/>
      <rect class="blk" x="0"  y="24" width="15" height="15" rx="3" style="animation-delay:.72s"/>
      <rect class="blk" x="24" y="24" width="15" height="15" rx="3" style="animation-delay:.90s"/>
      <rect class="blk" x="48" y="24" width="15" height="15" rx="3" style="animation-delay:1.08s"/>
      <rect class="blk" x="72" y="24" width="15" height="15" rx="3" style="animation-delay:1.26s"/>
    </g>

    <!-- right: pages mapping in — same grid, outlined instead of filled -->
    <g transform="translate(837 80)" fill="none" stroke="#8b5cf6" stroke-width="2">
      <rect class="blk" x="1"  y="1"  width="13" height="13" rx="2.5" style="animation-delay:1.40s"/>
      <rect class="blk" x="25" y="1"  width="13" height="13" rx="2.5" style="animation-delay:1.22s"/>
      <rect class="blk" x="49" y="1"  width="13" height="13" rx="2.5" style="animation-delay:1.04s"/>
      <rect class="blk" x="73" y="1"  width="13" height="13" rx="2.5" style="animation-delay:.86s"/>
      <rect class="blk" x="1"  y="25" width="13" height="13" rx="2.5" style="animation-delay:.68s"/>
      <rect class="blk" x="25" y="25" width="13" height="13" rx="2.5" style="animation-delay:.50s"/>
      <rect class="blk" x="49" y="25" width="13" height="13" rx="2.5" style="animation-delay:.32s"/>
      <rect class="blk" x="73" y="25" width="13" height="13" rx="2.5" style="animation-delay:.14s"/>
    </g>

    <!-- flanks drawn rather than typed so there is no font coverage risk -->
    <g stroke="url(#ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
      <path d="M 252 74 L 236 100 L 252 126"/>
      <path d="M 264 74 L 264 126"/>
      <path d="M 736 74 L 736 126"/>
      <path d="M 748 74 L 764 100 L 748 126"/>
    </g>

    <text class="mono" x="500" y="114" text-anchor="middle"
          font-size="42" font-weight="700" letter-spacing="4" fill="url(#ink)">ABHAY SINGH</text>

    <rect class="cursor" x="700" y="82" width="13" height="34" rx="1.5" fill="#22d3ee" opacity="0.9"/>

    <text class="mono" x="500" y="152" text-anchor="middle"
          font-size="14" letter-spacing="3" fill="#8b949e">operating systems &#183; compilers &#183; bare-metal rust</text>

    <rect x="0.5" y="0.5" width="999" height="199" rx="14" fill="none" stroke="#30363d"/>
  </g>
</svg>
